; LPG level monitor - Wemos/LOLIN D1 mini Pro (ESP8266EX) + DYP L062MUW
; Open this folder in VS Code with the PlatformIO extension, then Build / Upload.

[env:d1_mini_pro]
platform = espressif8266
board = d1_mini_pro
framework = arduino

monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    ; Uncomment the next line to read the sensor with SoftwareSerial on D7
    ; instead of the hardware UART. That keeps USB serial debug output, but
    ; 115200 baud in software is less reliable while WiFi is busy.
    ; -D SENSOR_SOFTSERIAL
